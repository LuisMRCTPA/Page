<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - PetCare Shop</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <i class="fas fa-paw"></i>
                <span>PetCare Shop</span>
            </div>
            <div class="menu-icon" id="menuIcon">
                <i class="fas fa-bars"></i>
            </div>
            <div class="nav-links" id="navLinks">
                <a href="index.html">Inicio</a>
                <a href="tienda.html">Tienda</a>
                <a href="perfil.html" class="active">Mi Perfil</a>
                <a href="#" id="logoutBtnPerfil"><i class="fas fa-sign-out-alt"></i> Salir</a>
            </div>
        </div>
    </nav>

    <div class="profile-container">
        <div class="profile-header">
            <div class="profile-avatar">
                <i class="fas fa-user-circle"></i>
            </div>
            <h1>Mi Perfil</h1>
            <p>Gestiona tu información personal y revisa tu historial de compras</p>
        </div>

        <div class="profile-tabs">
            <button class="tab-btn active" data-tab="info">Información Personal</button>
            <button class="tab-btn" data-tab="history">Historial de Compras</button>
        </div>

        <div class="profile-content">
            <div class="profile-tab active" id="infoTab">
                <div class="profile-info">
                    <h2><i class="fas fa-user-edit"></i> Editar Perfil</h2>
                    <form id="profileForm">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Nombre</label>
                                <input type="text" id="profileNombre" required>
                            </div>
                            <div class="form-group">
                                <label>Apellido</label>
                                <input type="text" id="profileApellido" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Correo Electrónico</label>
                            <input type="email" id="profileEmail" required>
                        </div>
                        <div class="form-group">
                            <label>Teléfono</label>
                            <input type="tel" id="profileTelefono" required>
                        </div>
                        <div class="form-group">
                            <label>Dirección</label>
                            <input type="text" id="profileDireccion" required>
                        </div>
                        <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Actualizar Perfil</button>
                    </form>
                </div>
            </div>

            <div class="profile-tab" id="historyTab">
                <div class="order-history">
                    <h2><i class="fas fa-history"></i> Historial de Compras</h2>
                    <div id="orderHistory" class="order-list"></div>
                    <div class="total-spent">
                        <h3>Total Gastado: ₡<span id="totalSpent">0</span></h3>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/perfil.js"></script>
</body>
</html>
