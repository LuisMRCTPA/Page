<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - PetCare Shop</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <i class="fas fa-paw"></i>
                <span>PetCare Shop</span>
            </div>
            <div class="menu-icon" id="menuIcon">
                <i class="fas fa-bars"></i>
            </div>
            <div class="nav-links" id="navLinks">
                <a href="index.html">Inicio</a>
                <a href="login.html">Iniciar Sesión</a>
                <a href="registro.html" class="active">Registrarse</a>
            </div>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <i class="fas fa-paw"></i>
                <h2>Crear Cuenta</h2>
                <p>Únete a nuestra comunidad de amantes de mascotas</p>
            </div>
            <form id="registerForm">
                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> Nombre</label>
                        <input type="text" id="nombre" placeholder="Tu nombre" required>
                        <span class="error-message" id="nombreError"></span>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> Apellido</label>
                        <input type="text" id="apellido" placeholder="Tu apellido" required>
                        <span class="error-message" id="apellidoError"></span>
                    </div>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Correo Electrónico</label>
                    <input type="email" id="email" placeholder="tu@email.com" required>
                    <span class="error-message" id="emailError"></span>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-phone"></i> Teléfono</label>
                    <input type="tel" id="telefono" placeholder="8888-8888" required>
                    <span class="error-message" id="telefonoError"></span>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-map-marker-alt"></i> Dirección</label>
                    <input type="text" id="direccion" placeholder="Tu dirección completa" required>
                    <span class="error-message" id="direccionError"></span>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Contraseña</label>
                    <input type="password" id="password" placeholder="Mínimo 6 caracteres" required>
                    <span class="error-message" id="passwordError"></span>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-check-circle"></i> Confirmar Contraseña</label>
                    <input type="password" id="confirmPassword" placeholder="Repite tu contraseña" required>
                    <span class="error-message" id="confirmError"></span>
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="termsCheckbox" required>
                        Acepto los <a href="#">Términos y Condiciones</a>
                    </label>
                </div>
                <button type="submit" class="btn-primary btn-block">Registrarse</button>
                <p class="auth-link">¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
